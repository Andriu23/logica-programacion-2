<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/script.js"></script>
</head>
<body>
    <header>
        <h1>Práctica de Conversión de Temperaturas</h1>
    </header>

    <main class="contenido">
        <form class="formulario">
            <fieldset class="fieldset">
                <label for="Celsius">Grados Celsius:</label>
                <input type="text" id="Celsius" placeholder="Ingrese °Celsius">
            </fieldset>
            <input type="button" id="btnConvertir" value="Convertir a °F y Kelvin">
        </form>

        <div id="resultado"></div>
    </main>
    <footer>
        <p>@ Actividad : <span>Conversión de Temperaturas</span></p>
    </footer>
</body>
</html>
